name: JEV retrieval validation

on:
  push:
    branches: [feat/jev-node-retrieval]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Focused JEV and handoff tests (mocked, no paid requests)
        run: python -m pytest -q tests/test_jev_retrieval.py tests/test_jev_teacher_guide.py --junitxml=/tmp/validation/jev.xml
        env:
          TYPESAFE_API_KEY: ''
      - name: Existing suite plus JEV regressions
        run: python -m pytest -q --junitxml=/tmp/validation/all.xml
        env:
          PAGEINDEX_API_KEY: ''
          TYPESAFE_API_KEY: ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: /tmp/validation/*.xml
          retention-days: 7
